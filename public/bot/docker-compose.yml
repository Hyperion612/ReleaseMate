version: '3.8'

services:
  bot:
    build: .
    container_name: timursounds_bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      # Сохранение базы данных между перезапусками
      - bot_data:/app/data
    networks:
      - bot_network

networks:
  bot_network:
    driver: bridge

volumes:
  bot_data:
    driver: local
